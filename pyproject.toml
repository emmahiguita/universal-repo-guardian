[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-repo-guardian"
version = "2.0.0"
description = "QA universal de repositorios, forensia de código e inteligencia adaptativa de bugs con evidencia (MCP)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nano-repo-guardian = "nano_repo_guardian.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nano_repo_guardian*"]
